# Render Blueprint — deploys the whole stack with one click / one CLI command:
#   1. Push this repo to GitHub
#   2. In Render: New -> Blueprint -> pick this repository -> Apply
# (or: `render blueprint launch`)
#
# The web service builds the Docker image (Dockerfile: React build + Django +
# gunicorn) and connects it to the free PostgreSQL database below. Django
# serves the built React SPA on the same origin, so no CORS or split-domain
# cookie configuration is required.

services:
  - type: web
    name: digital-agreement-signing
    runtime: docker
    plan: free # upgrade to `starter` for always-on + persistent disks
    healthCheckPath: /api/pdf_agreement/
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Matches the *.onrender.com domain Render assigns
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # SPA and API share one origin -> same-origin requests need no CORS list
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      # Cookie settings for a single HTTPS origin
      - key: COOKIE_SECURE
        value: "True"
      - key: COOKIE_SAMESITE
        value: "Lax"
      # Postgres provisioned below (Render injects the connection string)
      - key: DATABASE_URL
        fromDatabase:
          name: das-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "3"
      # First-run admin for a fresh database (see seed_default_admin).
      # The free-plan service runs on in-container sqlite, which resets on
      # every deploy — this guarantees someone can always log in.
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        sync: false  # blueprint deploys prompt for it; CHANGE the default

databases:
  - name: das-db
    plan: free
    databaseName: digital_agreement
    user: das_app

# NOTE: on the free plan uploaded files (photos/signatures) are stored on an
# ephemeral disk and reset on deploy/restart. Upgrade the service to `starter`
# and add a disk to persist them:
#
#    disk:
#      name: media
#      mountPath: /app/backend/media
#      sizeGB: 1
